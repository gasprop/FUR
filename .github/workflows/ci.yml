name: ci

on:
  push:
    branches: [main, 'arena/*']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - name: check bundle size <30KB gzipped
        run: |
          SIZE=$(gzip -c dist/index.js | wc -c)
          echo "gzipped=$SIZE bytes"
          test $SIZE -lt 30720 || (echo "❌ bundle too large" && exit 1)
      - run: npm pack --dry-run
      - name: verify playground builds
        run: node --check bin/cli.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=moderate
